name: Deploy to EC2 via SSM

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Docker Build and Push"]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: student-task-tracker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == 'Proxodik/student-task-tracker')
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::311681428483:role/Student-Task-Tracker-GitHub-Deploy
          aws-region: eu-north-1

      - name: Prepare deployment commands
        run: |
          cat > ssm-params.json <<'JSON'
          {
            "commands": [
              "set -eu",
              "docker pull illiadevops/student-task-tracker:latest",
              "docker rm -f student-task-tracker || true",
              "docker run -d --name student-task-tracker --restart unless-stopped -p 3000:3000 illiadevops/student-task-tracker:latest",
              "sleep 3",
              "curl --fail --silent --show-error http://127.0.0.1:3000/"
            ]
          }
          JSON

      - name: Deploy through AWS SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-07eaa0ee7b840e404 \
            --document-name AWS-RunShellScript \
            --parameters file://ssm-params.json \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 36); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-07eaa0ee7b840e404 \
              --query Status --output text 2>/dev/null) || {
                sleep 5
                continue
              }

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id i-07eaa0ee7b840e404 \
                  --query StandardOutputContent \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id i-07eaa0ee7b840e404 \
                  --query StandardErrorContent \
                  --output text
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Deployment verification timed out"
          exit 1
